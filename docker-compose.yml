name: xyz-bot

# A pure Telegram bot: no website, no inbound ports. The bot uses long polling.
#
# Run everything (this computer or a VPS):
#   docker compose --profile app up -d --build
# Development (infra only, the app runs from the venv — see README):
#   docker compose up -d postgres redis

x-app: &app
  build: .
  image: xyz-bot-app
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://xyz:${POSTGRES_PASSWORD:-xyz}@postgres:5432/xyz
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  profiles: ["app"]

x-after-migrate: &after-migrate
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xyz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xyz}
      POSTGRES_DB: xyz
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xyz -d xyz"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: [*app, *after-migrate]
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "bot"]
      interval: 60s
      start_period: 60s
      retries: 3

  worker:
    <<: [*app, *after-migrate]
    command: ["arq", "app.workers.main.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 60s
      start_period: 90s
      retries: 3

  # Daily DB dump + weekly restore test (TZ §19), see scripts/backup_scheduler.sh and docs/BACKUP.md.
  backup:
    <<: *app
    command: ["scripts/backup_scheduler.sh"]
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://xyz:${POSTGRES_PASSWORD:-xyz}@postgres:5432/xyz
      REDIS_URL: redis://redis:6379/0
      PGHOST: postgres
      PGUSER: xyz
      PGPASSWORD: ${POSTGRES_PASSWORD:-xyz}
    volumes: ["./backups:/srv/backups"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
