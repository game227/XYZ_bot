<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Fayl yuklash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #ffffff); --fg: var(--tg-theme-text-color, #111);
          --muted: var(--tg-theme-hint-color, #777); --accent: var(--tg-theme-button-color, #2ea6ff);
          --accent-fg: var(--tg-theme-button-text-color, #fff); --card: var(--tg-theme-secondary-bg-color, #f2f3f5); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-top: 14px; }
  input[type=file] { width: 100%; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; margin-top: 12px;
           background: var(--accent); color: var(--accent-fg); }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; }
  progress { width: 100%; height: 14px; margin-top: 12px; }
  #status { margin-top: 10px; min-height: 1.4em; word-break: break-word; }
  #status.err { color: #d93025; }
</style>
</head>
<body>
<main>
  <h1>⬆️ Fayl yuklash</h1>
  <div class="muted" id="target"></div>
  <div class="card">
    <input id="file" type="file" accept=".mp4,.mov,.m4v,.mkv,.webm,.mp3,.m4a,.aac,.ogg,.oga,.wav,.pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip">
    <div class="muted" id="fileinfo"></div>
    <progress id="bar" max="100" value="0" hidden></progress>
    <div id="status"></div>
    <button id="go" type="button" disabled>Yuklashni boshlash</button>
    <button id="cancel" type="button" class="secondary" hidden>Bekor qilish</button>
  </div>
  <p class="muted">Aloqa uzilsa, shu faylni qayta tanlang — yuklash to‘xtagan joyidan davom etadi.
     Har bir qism SHA-256 bilan tekshiriladi. Videolar yuklangach himoyalangan formatga o‘giriladi.</p>
</main>
<script>
(() => {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const lessonId = params.get("lesson") ? Number(params.get("lesson")) : null;
  const CONCURRENCY = 3, RETRIES = 4;
  let file = null, aborted = false, mediaId = null;

  function status(text, err) { $("status").textContent = text || ""; $("status").className = err ? "err" : ""; }
  function fmtSize(n) { return n > 1 << 30 ? (n / (1 << 30)).toFixed(2) + " GB" : (n / (1 << 20)).toFixed(1) + " MB"; }
  function resumeKey(f) { return "upl:" + [lessonId, f.name, f.size, f.lastModified].join(":"); }
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }

  if (!tg || !tg.initData) { status("Sahifani Telegram bot orqali oching.", true); return; }
  if (!window.crypto || !crypto.subtle) { status("Xavfsiz ulanish (HTTPS) kerak.", true); return; }
  tg.ready(); tg.expand();
  $("target").textContent = lessonId ? "Dars #" + lessonId + " uchun material" : "Media kutubxonasi";

  async function api(method, path, body, extraHeaders) {
    const headers = Object.assign({ "X-Telegram-Init-Data": tg.initData }, extraHeaders || {});
    if (body && !(body instanceof Blob) && !(body instanceof ArrayBuffer)) { headers["Content-Type"] = "application/json"; body = JSON.stringify(body); }
    const resp = await fetch(path, { method, headers, body, cache: "no-store" });
    let data = null;
    try { data = await resp.json(); } catch (_) {}
    if (!resp.ok) { const e = new Error((data && data.detail) || ("Xatolik: " + resp.status)); e.status = resp.status; throw e; }
    return data;
  }

  async function sha256Hex(buf) {
    const d = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
    return Array.from(d, (b) => b.toString(16).padStart(2, "0")).join("");
  }

  async function sendPart(info, n) {
    const start = (n - 1) * info.part_size;
    const buf = await file.slice(start, Math.min(start + info.part_size, file.size)).arrayBuffer();
    const sum = await sha256Hex(buf);
    for (let attempt = 1; ; attempt++) {
      if (aborted) throw new Error("Bekor qilindi.");
      try {
        return await api("PUT", `/media/api/uploads/${info.media_id}/parts/${n}`, buf, { "X-Part-Sha256": sum, "Content-Type": "application/octet-stream" });
      } catch (e) {
        if (attempt >= RETRIES || (e.status && e.status < 500 && e.status !== 400)) throw e;
        await new Promise((r) => setTimeout(r, 1000 * 2 ** attempt));
      }
    }
  }

  async function run() {
    aborted = false;
    $("go").disabled = true; $("file").disabled = true; $("cancel").hidden = false; $("bar").hidden = false;
    let info = null;
    const saved = load(resumeKey(file));
    if (saved) {
      try { info = await api("GET", `/media/api/uploads/${saved}`); status("Avvalgi yuklash davom ettirilmoqda…"); }
      catch (_) { store(resumeKey(file), null); }
    }
    if (!info) {
      info = await api("POST", "/media/api/uploads", { filename: file.name, size: file.size, lesson_id: lessonId });
      store(resumeKey(file), String(info.media_id));
    }
    mediaId = info.media_id;
    const done = new Set(info.uploaded_parts || []);
    const todo = [];
    for (let n = 1; n <= info.total_parts; n++) if (!done.has(n)) todo.push(n);
    const update = () => { $("bar").value = Math.round((done.size / info.total_parts) * 100); status(`Yuklanmoqda: ${done.size}/${info.total_parts} qism`); };
    update();
    const workers = Array.from({ length: CONCURRENCY }, async () => {
      while (todo.length) { const n = todo.shift(); await sendPart(info, n); done.add(n); update(); }
    });
    await Promise.all(workers);
    status("Yakunlanmoqda…");
    const res = await api("POST", `/media/api/uploads/${info.media_id}/complete`);
    store(resumeKey(file), null);
    $("bar").value = 100; $("cancel").hidden = true;
    status(res.status === "uploaded" ? "✅ Yuklandi. Fayl qayta ishlanmoqda — tayyor bo‘lgach botda xabar keladi." : "✅ Yuklandi.");
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
  }

  $("file").addEventListener("change", (e) => {
    file = e.target.files[0] || null;
    $("fileinfo").textContent = file ? `${file.name} · ${fmtSize(file.size)}` : "";
    $("go").disabled = !file; status("");
  });
  $("go").addEventListener("click", () => run().catch((e) => {
    status(e.message, true); $("go").disabled = false; $("file").disabled = false; $("cancel").hidden = true;
  }));
  $("cancel").addEventListener("click", async () => {
    aborted = true;
    if (mediaId) { try { await api("DELETE", `/media/api/uploads/${mediaId}`); } catch (_) {} }
    if (file) store(resumeKey(file), null);
    status("Bekor qilindi."); $("go").disabled = !file; $("file").disabled = false; $("cancel").hidden = true;
  });
})();
</script>
</body>
</html>
