<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Video dars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #0f1115); --fg: var(--tg-theme-text-color, #f2f2f2);
          --muted: var(--tg-theme-hint-color, #9aa0a6); --accent: var(--tg-theme-button-color, #2ea6ff); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
               font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 12px 16px 24px; max-width: 960px; margin: 0 auto; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px;
           overflow: hidden; user-select: none; -webkit-user-select: none; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  #wm { position: absolute; pointer-events: none; color: rgba(255,255,255,.38); font-weight: 600;
        font-size: clamp(12px, 2.4vw, 18px); text-shadow: 0 0 3px rgba(0,0,0,.6);
        transition: top 1.2s ease, left 1.2s ease; white-space: nowrap; z-index: 2; }
  #fs { position: absolute; right: 8px; top: 8px; z-index: 3; border: 0; border-radius: 8px; padding: 6px 10px;
        background: rgba(0,0,0,.45); color: #fff; font-size: 13px; }
  #stage:fullscreen, #stage:-webkit-full-screen { border-radius: 0; aspect-ratio: auto; }
  h1 { font-size: 16px; margin: 12px 0 4px; word-break: break-word; }
  #msg { color: var(--muted); margin-top: 8px; min-height: 1.4em; }
  #msg.err { color: #ff6b6b; }
  .note { color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body oncontextmenu="return false">
<main>
  <div id="stage">
    <video id="video" controls playsinline controlslist="nodownload noremoteplayback" disablepictureinpicture
           disableremoteplayback preload="metadata"></video>
    <div id="wm"></div>
    <button id="fs" type="button" aria-label="To‘liq ekran">⛶</button>
  </div>
  <h1 id="title"></h1>
  <div id="msg">Yuklanmoqda…</div>
  <p class="note">Video faqat siz uchun ochilgan. Yozib olish va tarqatish taqiqlanadi.</p>
</main>
<script>
(() => {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  const video = document.getElementById("video");
  const wm = document.getElementById("wm");
  const msg = document.getElementById("msg");
  const params = new URLSearchParams(location.search);
  const mediaId = Number(params.get("media"));
  const lessonId = params.get("lesson") ? Number(params.get("lesson")) : null;
  let token = null;
  let refreshTimer = null;

  function show(text, isError) { msg.textContent = text || ""; msg.className = isError ? "err" : ""; }

  if (!tg || !tg.initData) { show("Videoni Telegram bot orqali oching.", true); return; }
  tg.ready(); tg.expand();

  async function requestToken(native) {
    const resp = await fetch("/media/api/play", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData },
      body: JSON.stringify({ media_id: mediaId, lesson_id: lessonId, native: !!native }),
      cache: "no-store",
    });
    let data = null;
    try { data = await resp.json(); } catch (_) { /* ignore */ }
    if (!resp.ok) { throw new Error((data && data.detail) || "Videoni ochib bo‘lmadi."); }
    return data;
  }

  function scheduleRefresh(expiresIn) {
    clearTimeout(refreshTimer);
    const delay = Math.max(30, expiresIn - 90) * 1000;
    refreshTimer = setTimeout(async () => {
      try {
        const data = await requestToken(false);
        token = data.token;           // new segment/key requests use it (see xhrSetup)
        scheduleRefresh(data.expires_in);
      } catch (e) {
        video.pause();
        show(e.message, true);        // access was lost (e.g. subscription ended)
      }
    }, delay);
  }

  function moveWatermark() {
    const stage = document.getElementById("stage").getBoundingClientRect();
    const w = wm.offsetWidth, h = wm.offsetHeight;
    wm.style.left = Math.floor(Math.random() * Math.max(1, stage.width - w - 8)) + 4 + "px";
    wm.style.top = Math.floor(Math.random() * Math.max(1, stage.height - h - 8)) + 4 + "px";
  }

  document.getElementById("fs").addEventListener("click", () => {
    const stage = document.getElementById("stage");
    // Fullscreen the container, not the <video>, so the watermark stays visible.
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    (stage.requestFullscreen || stage.webkitRequestFullscreen || (() => {})).call(stage);
  });

  async function start() {
    const useHlsJs = window.Hls && Hls.isSupported();
    const nativeHls = !useHlsJs && video.canPlayType("application/vnd.apple.mpegurl");
    if (!useHlsJs && !nativeHls) { show("Qurilmangiz bu videoni qo‘llab-quvvatlamaydi.", true); return; }

    const data = await requestToken(nativeHls);
    token = data.token;
    wm.textContent = data.watermark + " · " + (tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name || "");
    document.getElementById("title").textContent = data.title || "";
    moveWatermark(); setInterval(moveWatermark, 7000);

    if (useHlsJs) {
      const hls = new Hls({
        enableWorker: true,
        xhrSetup(xhr, url) {
          // Always use the freshest token: /media/hls/<token>/...
          xhr.open("GET", url.replace(/\/media\/hls\/[^/]+\//, "/media/hls/" + token + "/"), true);
        },
      });
      hls.on(Hls.Events.ERROR, (_, err) => {
        if (!err.fatal) return;
        if (err.response && err.response.code === 403) { show("Ruxsat muddati tugadi. Videoni botdan qayta oching.", true); hls.destroy(); return; }
        if (err.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); return; }
        if (err.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
        show("Videoni ijro etib bo‘lmadi.", true); hls.destroy();
      });
      hls.loadSource(data.playlist_url);
      hls.attachMedia(video);
      scheduleRefresh(data.expires_in);
    } else {
      video.src = data.playlist_url;
    }
    show("");
  }

  start().catch((e) => show(e.message || "Xatolik yuz berdi.", true));
})();
</script>
</body>
</html>
